appId: com.chojema.filedesk
productName: Chojema FileDesk
copyright: Copyright © 2026 Chulwoo Park
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  # Drag image for files dragged out of the window.
  - resources/icon-256.png
  - "!**/*.map"
  - "!node_modules/cpu-features/**/*"
  - "!node_modules/ssh2/lib/protocol/crypto/build/**/*"
asar: true
# SSH uses its JavaScript implementation on every target CPU.
npmRebuild: false
publish: null

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  # "-" = ad-hoc signature (required for Apple Silicon). Set CSC_NAME to use a Developer ID.
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSAppleEventsUsageDescription: Finder의 정보 가져오기와 가상본 만들기에 사용합니다. Used for Finder Get Info and Make Alias.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: Chojema-FileDesk-${version}-mac-${arch}.${ext}
dmg:
  title: Chojema FileDesk ${version}

win:
  icon: build/icon-win.png
  executableName: ChojemaFileDesk
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  artifactName: Chojema-FileDesk-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Chojema FileDesk
  installerLanguages: [ko_KR, en_US]
  language: "1042"
  artifactName: Chojema-FileDesk-${version}-win-${arch}-setup.${ext}
portable:
  artifactName: Chojema-FileDesk-${version}-win-${arch}-portable.${ext}
