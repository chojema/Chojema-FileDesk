<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B5CF6"/>
      <stop offset="0.55" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#E4E7FF"/>
    </linearGradient>
    <linearGradient id="panelR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FDBA4D"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b0d2a" flood-opacity="0.35"/>
    </filter>
    <clipPath id="panelClip"><rect x="168" y="220" width="320" height="584" rx="44"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- left panel (active) -->
  <g filter="url(#soft)">
    <rect x="168" y="220" width="320" height="584" rx="44" fill="url(#panelL)"/>
  </g>
  <rect x="168" y="220" width="320" height="72" fill="#C7CCFF" opacity="0.55" clip-path="url(#panelClip)"/>
  <rect x="210" y="338" width="236" height="34" rx="17" fill="#6366F1"/>
  <rect x="210" y="404" width="180" height="22" rx="11" fill="#A5ABE8"/>
  <rect x="210" y="456" width="210" height="22" rx="11" fill="#A5ABE8"/>
  <rect x="210" y="508" width="150" height="22" rx="11" fill="#A5ABE8"/>
  <rect x="210" y="560" width="196" height="22" rx="11" fill="#A5ABE8"/>
  <rect x="210" y="612" width="128" height="22" rx="11" fill="#A5ABE8"/>

  <!-- right panel (glass) -->
  <rect x="536" y="220" width="320" height="584" rx="44" fill="url(#panelR)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3"/>
  <rect x="578" y="338" width="196" height="22" rx="11" fill="#ffffff" opacity="0.6"/>
  <rect x="578" y="390" width="236" height="22" rx="11" fill="#ffffff" opacity="0.6"/>
  <rect x="578" y="442" width="160" height="22" rx="11" fill="#ffffff" opacity="0.6"/>
  <rect x="578" y="494" width="210" height="22" rx="11" fill="#ffffff" opacity="0.6"/>

  <!-- transfer arrow -->
  <g filter="url(#soft)">
    <path d="M330 700 C 420 700, 470 640, 560 640 L 640 640" fill="none" stroke="url(#arrow)" stroke-width="46" stroke-linecap="round"/>
    <path d="M622 584 L 712 640 L 622 696 Z" fill="#FF7A59" stroke="#FF7A59" stroke-width="22" stroke-linejoin="round"/>
  </g>
</svg>
